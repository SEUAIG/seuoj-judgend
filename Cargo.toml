[package]
name = "aij-judgend"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.4"
tokio = { version = "1.48.0", features = ["full"] }
axum = "0.8.7"
judger = "0.5.1"
serde_json = "1.0.145"
reqwest = { version = "0.12.26", features = ["json"] }

[dev-dependencies]
axum-test = "18.4.1"
